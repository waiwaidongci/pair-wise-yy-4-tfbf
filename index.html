<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜次复核台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    h3 { margin: 0; font-size: 18px; }
    h4 { margin: 12px 0 6px; font-size: 14px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { background: #a9bdc0; cursor: not-allowed; }
    button.secondary { background: #64777b; }
    .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .tabs { display: flex; gap: 8px; padding: 12px 16px 0; }
    .tab { background: #b8cfd2; color: #23444a; }
    .tab.active { background: #1d6c78; color: #fff; }
    .app { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 178px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 330px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.signed { background: #dff0e3; border-color: #7fae8b; color: #2f6b41; }
    .muted { color: #5c7378; font-size: 13px; }

    /* 复核台 */
    .review { display: none; padding: 16px; }
    .review.active { display: block; }
    .review-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
    .review-bar select { width: auto; min-width: 150px; }
    .review-bar .grow { flex: 1; }
    .review-cards { display: grid; gap: 14px; }
    .review-card { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 16px; }
    .review-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .status-pill { padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; }
    .status-pill.signed { background: #dff0e3; color: #2f6b41; border: 1px solid #7fae8b; }
    .status-pill.pending { background: #fdf0d9; color: #8a5a17; border: 1px solid #d8ae6f; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
    .metric { background: #f2f8f9; border: 1px solid #d7e4e5; border-radius: 8px; padding: 9px 11px; }
    .metric span { display: block; font-size: 12px; color: #5c7378; }
    .metric b { display: block; margin-top: 3px; font-size: 14px; word-break: break-all; }
    .mark-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .mark-table th, .mark-table td { border: 1px solid #dde8e9; padding: 7px 9px; text-align: left; }
    .mark-table th { background: #f2f8f9; }
    tr.row-missing td { background: #fdf2f1; }
    .missing { color: #b4402f; font-weight: 800; }
    .warn-box { background: #fdf0d9; border: 1px solid #d8ae6f; border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 13px; }
    .sign-box { border-top: 1px dashed #c9dadc; margin-top: 12px; padding-top: 6px; }
    .sign-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
    .review-error { color: #b4402f; font-size: 13px; margin-top: 8px; }
    .signed-box { background: #f1f7f2; border: 1px solid #b6d3be; border-radius: 8px; padding: 10px 12px; margin-top: 12px; display: grid; gap: 4px; }
    .history { border-top: 1px dashed #c9dadc; margin-top: 12px; padding-top: 4px; }
    .history-entry { font-size: 13px; padding: 4px 0; }
    .history-entry.voided { color: #8a5a17; }
    .empty { background: #fff; border: 1px dashed #c9dadc; border-radius: 8px; padding: 28px; text-align: center; color: #5c7378; }
    .import-report { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
    .import-report h4 { margin-top: 4px; }
    .conflict-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
    .conflict-table th, .conflict-table td { border: 1px solid #dde8e9; padding: 6px 8px; text-align: left; }
    .conflict-table th { background: #f2f8f9; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } .metrics { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜次复核台</h1><div class="muted">标记平面图与潜次复核：汇总标记、深度和保存状态，缺资料不能签字。</div></div>
    <div class="head-actions">
      <button id="exportJsonBtn" class="secondary">导出JSON</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="mapView">标记平面图</button>
    <button class="tab" data-view="reviewView">潜次复核台</button>
  </nav>

  <main id="mapView">
    <div class="app">
      <section class="panel">
        <div class="map" id="map"><div class="wreck"></div></div>
      </section>
      <aside class="panel">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m">
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </aside>
    </div>
  </main>

  <section id="reviewView" class="review" data-role="root">
    <div class="review-bar">
      <label style="margin:0">复核状态</label>
      <select data-role="filter">
        <option value="">全部状态</option>
        <option value="pending">待复核</option>
        <option value="signed">已签字</option>
      </select>
      <span class="grow muted" data-role="count"></span>
      <button data-action="import">导入备份</button>
      <input type="file" accept="application/json,.json" data-role="importFile" hidden>
      <button data-action="exportMarks" class="secondary">导出标记清单</button>
      <button data-action="exportReview" class="secondary">导出复核汇总</button>
    </div>
    <div class="import-report" data-role="importReport" hidden></div>
    <div class="review-cards" data-role="list"></div>
  </section>

  <script src="js/store.js"></script>
  <script src="js/export.js"></script>
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 视图切换
    const tabs = document.querySelectorAll(".tab");
    const views = [document.querySelector("#mapView"), document.querySelector("#reviewView")];
    tabs.forEach(tab => tab.onclick = () => {
      tabs.forEach(t => t.classList.toggle("active", t === tab));
      views.forEach(v => v.classList.toggle("active", v.id === tab.dataset.view));
    });

    // 复核台按钮
    const reviewRoot = document.querySelector('[data-role="root"]');
    ReviewStation.init(reviewRoot);
    reviewRoot.addEventListener("click", event => {
      const btn = event.target.closest("[data-action]");
      if (!btn) return;
      if (btn.dataset.action === "import") {
        reviewRoot.querySelector('[data-role="importFile"]').click();
      } else if (btn.dataset.action === "exportMarks") {
        DiveExport.exportMarksCsv();
      } else if (btn.dataset.action === "exportReview") {
        DiveExport.exportReviewCsv();
      }
    });

    // 原有 JSON 导出照常可用（现在导出含复核记录的完整档案）
    document.querySelector("#exportJsonBtn").onclick = () => DiveExport.exportJson();
  </script>
</body>
</html>
