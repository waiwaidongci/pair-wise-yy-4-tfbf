<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录 · 潜次复核台</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜水记录 · 潜次复核台</h1>
      <div class="muted">平面图标记、潜次复核签字、备份合并与导出。</div>
    </div>
    <div class="actions">
      <button id="importBtn" class="secondary">导入备份</button>
      <button id="exportBtn">导出JSON</button>
      <button id="exportCsvBtn">导出标记清单</button>
      <button id="exportReviewBtn">导出复核汇总</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-target="mapPanel">平面图标记</button>
    <button class="tab" id="reviewTab" data-target="reviewPanel">潜次复核台</button>
  </nav>

  <main id="mapPanel" class="tab-panel active">
    <div class="app">
      <section class="panel">
        <div class="map" id="map"><div class="wreck"></div></div>
      </section>
      <aside class="panel">
        <div class="toolbar">
          <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <select id="view"><option value="list">标记列表</option><option value="timeline">潜次时间线</option></select>
        </div>
        <form id="form">
          <h2>标记信息</h2>
          <input name="id" type="hidden">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>潜次</label><input name="dive" placeholder="例如DIVE-04" required>
          <label>深度</label><input name="depth" placeholder="例如18.4m">
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div class="toolbar"><button>保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
        </form>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </aside>
    </div>
  </main>

  <section id="reviewPanel" class="tab-panel">
    <div class="review-wrap panel">
      <div class="review-bar">
        <div>
          <h2 style="margin-top:0">潜次复核台</h2>
          <div class="muted">按潜次汇总标记、深度与保存状态；标记缺资料时不能签字。已签字潜次的标记一经改动，签字自动失效并回到待复核，旧签字留在履历。</div>
        </div>
        <div>
          <label>复核状态</label>
          <select id="reviewFilter">
            <option value="">全部状态</option>
            <option value="pending">待复核</option>
            <option value="signed">已签字</option>
            <option value="incomplete">资料不齐</option>
          </select>
        </div>
      </div>
      <div id="conflictSlot"></div>
      <div id="diveGrid" class="dive-grid"></div>
    </div>
  </section>

  <script src="js/archive.js"></script>
  <script src="js/export.js"></script>
  <script src="js/review.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
